spring:
  application:
    name: pending-notification

  datasource:
    url: jdbc:postgresql://localhost:5432/pending_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # Configurações de retry e timeout
    connection-timeout: 10000
    # Template settings
    template:
      retry:
        enabled: true
        initial-interval: 1000
        max-interval: 10000
        multiplier: 2.0
        max-attempts: 3

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000
      # Configuração de conexão pool
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Configurações da aplicação
app:
  cache:
    # Tipos suportados: redis, memory
    type: redis
  messaging:
    # Tipos suportados: rabbitmq, memory
    type: rabbitmq

# Logging
logging:
  level:
    root: INFO
    br.com.teofilob.pendingnotification: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
